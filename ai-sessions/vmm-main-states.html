<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vmm-main 状态模型 · 状态图</title>
<style>
:root{
  --bg:#0d131d;--panel:#131c2a;--panel2:#18243a;--chip:#1c283d;--line:#26344c;--line2:#3a4d70;
  --text:#dce4f0;--muted:#8d9bb2;--faint:#5c6b84;
  --stable:#3cc8a8;--busy:#f2b445;--term:#ff7a6b;--proto:#f38fb9;--noauth:#e3c450;--export:#86d97f;--ext:#6b7a93;
  --req:#b69cff;--done:#6fa8ff;--fail:#ff6b6b;--stop:#ff9a57;--fact:#4fd1e8;--auth:#e3c450;--msg:#97a5bb;
  --mono:"JetBrains Mono","Cascadia Code","Fira Code","SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"Inter","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#f6f3ec;--panel:#fffdf8;--panel2:#f3efe5;--chip:#ece6d8;--line:#ddd5c4;--line2:#c4b9a2;
  --text:#1c2230;--muted:#5d6574;--faint:#9ba1ab;
  --stable:#0f8a6c;--busy:#b0700a;--term:#c43d2f;--proto:#b8326e;--noauth:#9a7a05;--export:#3d8a34;--ext:#8a93a3;
  --req:#6f45bd;--done:#2a5bcc;--fail:#c8312a;--stop:#c45a14;--fact:#08809a;--auth:#9a7a05;--msg:#6d7686;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.65 var(--sans)}
h1,h2,h3,h4,p{margin:0}
code{font-family:var(--mono);font-size:.86em;background:var(--chip);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--busy);outline-offset:3px}
.wrap{max-width:1500px;margin:0 auto;padding:0 22px}
header{padding:28px 0 14px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
header .kicker{font:700 11.5px var(--mono);letter-spacing:.14em;color:var(--stable);text-transform:uppercase}
header h1{font-size:26px;letter-spacing:-.01em;margin-top:6px}
header p{color:var(--muted);font-size:13.5px;margin-top:6px;max-width:900px}
.theme{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 11px;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--muted);font-size:13.5px}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--busy);font-weight:600}
.tabs button .n{font:700 12px var(--mono);color:var(--busy);margin-right:6px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.stage{padding:10px}
.stage svg{width:100%;height:auto;display:block;user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 10px 2px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid}
.legend i.box{width:16px;height:11px;border:2px solid;border-radius:3px}
.note{font-size:12.5px;color:var(--muted);padding:8px 10px 4px;border-top:1px dashed var(--line);margin-top:6px}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:16px 18px}
.side h4{font:600 13.5px var(--mono);margin-bottom:8px;overflow-wrap:anywhere}
.side .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.side p{font-size:13.5px}
.side p+p{margin-top:6px}
dl.kv{display:grid;grid-template-columns:58px 1fr;gap:6px 10px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted);font-size:12px;padding-top:1px}
dl.kv dd{margin:0}
.ref{font:11.5px/1.5 var(--mono);color:var(--muted);margin-top:12px}
.go{margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 11px;font-size:12.5px}
.go:hover{border-color:var(--busy)}
footer{color:var(--faint);font-size:12px;padding:22px 0 40px}

/* svg */
svg .region rect{fill:color-mix(in srgb,var(--panel2) 45%,transparent);stroke:var(--line2);stroke-width:1.2;stroke-dasharray:3 4}
svg .region text{font:600 12px var(--mono);fill:var(--muted)}
svg .region.hot rect{cursor:pointer}
svg .node rect{fill:var(--panel2);stroke-width:2}
svg .node.stable rect{stroke:var(--stable)}
svg .node.busy rect{stroke:var(--busy);stroke-dasharray:7 4}
svg .node.term rect{stroke:var(--term)}
svg .node.stall rect{stroke:var(--fail);stroke-dasharray:7 4}
svg .node.proto rect{stroke:var(--proto);stroke-dasharray:2 4;stroke-linecap:round}
svg .node.noauth rect{stroke:var(--noauth)}
svg .node.export rect{stroke:var(--export)}
svg .node.ext rect{stroke:var(--ext);stroke-dasharray:4 4;fill:transparent}
svg .node.end rect{stroke:var(--line2);fill:var(--chip)}
svg .node{cursor:pointer;transition:opacity .2s}
svg .node:hover rect,svg .node.sel rect{stroke-width:3.2}
svg .node .n-t{font:600 13px var(--mono);fill:var(--text);text-anchor:middle}
svg .node .n-s{font:11px var(--sans);fill:var(--muted);text-anchor:middle}
svg .edge{cursor:pointer;transition:opacity .2s}
svg .edge .line{fill:none;stroke-width:1.8}
svg .edge .hit{fill:none;stroke:transparent;stroke-width:14}
svg .edge:hover .line,svg .edge.sel .line{stroke-width:3.2}
svg .elabel{font:11.5px var(--mono);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
svg .edge.req .line{stroke:var(--req)}svg .edge.req .elabel{fill:var(--req)}svg .m-req{fill:var(--req)}
svg .edge.done .line{stroke:var(--done)}svg .edge.done .elabel{fill:var(--done)}svg .m-done{fill:var(--done)}
svg .edge.fail .line{stroke:var(--fail)}svg .edge.fail .elabel{fill:var(--fail)}svg .m-fail{fill:var(--fail)}
svg .edge.stop .line{stroke:var(--stop);stroke-dasharray:6 5}svg .edge.stop .elabel{fill:var(--stop)}svg .m-stop{fill:var(--stop)}
svg .edge.fact .line{stroke:var(--fact)}svg .edge.fact .elabel{fill:var(--fact)}svg .m-fact{fill:var(--fact)}
svg .edge.auth .line{stroke:var(--auth);stroke-width:2.6}svg .edge.auth .elabel{fill:var(--auth)}svg .m-auth{fill:var(--auth)}
svg .edge.msg .line{stroke:var(--msg);stroke-dasharray:2 5;stroke-linecap:round}svg .edge.msg .elabel{fill:var(--msg)}svg .m-msg{fill:var(--msg)}
svg .anno{font:12px var(--sans);fill:var(--muted)}
svg.focus .node:not(.hl),svg.focus .region:not(.hl){opacity:.28}
svg.focus .edge:not(.hl){opacity:.1}
svg.focus .edge.hl .line{stroke-width:3.2}

@media (max-width:1100px){
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">Dragonball Evolved · vmm-main 状态模型</div>
      <h1>状态图</h1>
      <p>对应 <code>ai-sessions/vmm-main-states.rs</code> 与 <code>.md</code>。整机状态由几个独立维度组成，这里分四张图：总览（准入 × Guest × 退出阶段）、<code>Owned</code> 内部的 <code>Exec</code>、拓扑槽位与作用域变更、运行权移交。点击节点或连线查看说明。</p>
    </div>
    <button class="theme" id="theme">切换明暗</button>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <div class="layout">
    <section class="card stage">
      <svg id="svg" role="img" aria-label="状态图"></svg>
      <div class="legend" id="legend"></div>
      <p class="note" id="note"></p>
    </section>
    <aside class="card side" id="side" aria-live="polite"></aside>
  </div>

  <footer>伪代码中的 [新] / [改] 类型均未实现；本图描述的是目标模型，不是当前代码。章节号指 <code>vmm-main-states.rs</code> 的 §0–§9。</footer>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// `x` in prose becomes <code>x</code>
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

// edge: id, from, to, kind, svg path, labels [[x, y, anchor, text]], title, description, source ref
const E = (id, from, to, k, d, labels, t, x, code) => ({ id, from, to, k, d, labels, t, x, code });

const NODE_LEGEND = {
  stable: ['solid', '稳定状态'],
  busy: ['dashed', '进行中：迁移 / 变更 / 导入'],
  export: ['solid', '带导出会话'],
  noauth: ['solid', '有机器、无运行权'],
  proto: ['dotted', '设备协议状态（不在 Topology）'],
  stall: ['dashed', '卡住，可重试'],
  term: ['solid', '退出阶段 / 故障'],
  ext: ['dashed', '另一张图或进程外'],
};
const EDGE_LEGEND = {
  req: '请求', done: '落地 / 提交', fact: '事实（guest 或机器报告）', fail: '失败',
  stop: '退出路径', auth: '运行权', msg: '跨进程数据',
};
const DIAGRAMS = [];
let cur = null;

function renderDiagram(D) {
  const svg = $('#svg');
  svg.setAttribute('viewBox', `0 0 ${D.w} ${D.h}`);
  const kinds = [...new Set(D.edges.map(e => e.k))];
  let h = '<defs>' + kinds.map(k =>
    `<marker id="ar-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-${k}"/></marker>`).join('') + '</defs>';
  for (const r of D.regions || []) {
    h += `<g class="region${r.info ? ' hot' : ''}" data-id="${r.id}"${r.info ? ' tabindex="0" role="button"' : ''}>`
      + `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="14"/>`
      + `<text x="${r.x + 14}" y="${r.top ? r.y + 22 : r.y + r.h - 12}">${esc(r.label)}</text></g>`;
  }
  for (const e of D.edges) {
    h += `<g class="edge ${e.k}" data-id="${e.id}" tabindex="0" role="button" aria-label="${esc(e.t)}">`
      + `<path class="hit" d="${e.d}"/><path class="line" d="${e.d}" marker-end="url(#ar-${e.k})"/>`
      + (e.labels || []).map(([x, y, a, t]) => `<text class="elabel" x="${x}" y="${y}" text-anchor="${a}">${esc(t)}</text>`).join('')
      + '</g>';
  }
  for (const [id, n] of Object.entries(D.nodes)) {
    const w = n.w || 160, hh = n.h || 54;
    h += `<g class="node ${n.k}" data-id="${id}" tabindex="0" role="button" aria-label="${esc(n.t)}" transform="translate(${n.x},${n.y})">`
      + `<rect x="${-w / 2}" y="${-hh / 2}" width="${w}" height="${hh}" rx="10"/>`
      + `<text class="n-t" y="${n.s ? -2 : 5}">${esc(n.t)}</text>`
      + (n.s ? `<text class="n-s" y="16">${esc(n.s)}</text>` : '') + '</g>';
  }
  for (const [x, y, a, t] of D.annos || []) h += `<text class="anno" x="${x}" y="${y}" text-anchor="${a}">${esc(t)}</text>`;
  svg.innerHTML = h;

  const nodeKinds = [...new Set(Object.values(D.nodes).map(n => n.k))].filter(k => NODE_LEGEND[k]);
  $('#legend').innerHTML = nodeKinds.map(k => {
    const [style, text] = NODE_LEGEND[k];
    return `<span><i class="box" style="border-color:var(--${k});border-style:${style}"></i>${text}</span>`;
  }).join('') + kinds.map(k =>
    `<span><i style="border-color:var(--${k});border-top-style:${k === 'stop' ? 'dashed' : k === 'msg' ? 'dotted' : 'solid'}"></i>${EDGE_LEGEND[k]}</span>`).join('');
  $('#note').innerHTML = fmt(D.note || '');
}

function focusGraph(nodes = [], edges = [], sel = null) {
  const svg = $('#svg');
  svg.classList.toggle('focus', nodes.length + edges.length > 0);
  $$('.node,.region', svg).forEach(g => {
    g.classList.toggle('hl', nodes.includes(g.dataset.id));
    g.classList.toggle('sel', g.dataset.id === sel);
  });
  $$('.edge', svg).forEach(g => {
    g.classList.toggle('hl', edges.includes(g.dataset.id));
    g.classList.toggle('sel', g.dataset.id === sel);
  });
}

const nameOf = id => cur.nodes[id]?.t || (cur.regions || []).find(r => r.id === id)?.label || id;
const goButton = go => go ? `<button class="go" data-go="${go}">打开「${esc(DIAGRAMS.find(d => d.id === go).tab)}」图 →</button>` : '';

function showIntro() {
  $('#side').innerHTML = `<h4>${esc(cur.title)}</h4>` + cur.intro.map(p => `<p>${fmt(p)}</p>`).join('')
    + '<p class="sub" style="margin-top:12px">点击节点或连线查看说明；点击空白处返回此处。</p>';
  focusGraph();
}

function showNode(id) {
  const n = cur.nodes[id] || (cur.regions || []).find(r => r.id === id);
  if (!n || !n.info) return;
  const edges = cur.edges.filter(e => e.from === id || e.to === id);
  const nodes = [...new Set([id, ...edges.flatMap(e => [e.from, e.to])])];
  const { rows = [], d, code, go } = n.info;
  $('#side').innerHTML = `<h4>${esc(n.t || n.label)}</h4>`
    + (d ? `<p>${fmt(d)}</p>` : '')
    + (rows.length ? `<dl class="kv"${d ? ' style="margin-top:10px"' : ''}>` + rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${fmt(v)}</dd>`).join('') + '</dl>' : '')
    + (code ? `<p class="ref">${esc(code)}</p>` : '') + goButton(go);
  focusGraph(nodes, edges.map(e => e.id), id);
}

function showEdge(id) {
  const e = cur.edges.find(x => x.id === id);
  $('#side').innerHTML = `<h4>${fmt(e.t)}</h4><p class="sub">${esc(nameOf(e.from))} → ${esc(nameOf(e.to))}</p>`
    + `<p>${fmt(e.x || '')}</p>` + (e.code ? `<p class="ref">${esc(e.code)}</p>` : '');
  focusGraph([e.from, e.to], [id], id);
}

function openDiagram(id) {
  cur = DIAGRAMS.find(d => d.id === id) || DIAGRAMS[0];
  $$('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === cur.id)));
  renderDiagram(cur);
  showIntro();
  if (location.hash.slice(1) !== cur.id) history.replaceState(null, '', '#' + cur.id);
}
DIAGRAMS.push({
  id: 'overview', tab: '总览', title: '总览：准入 × Guest × 退出阶段', w: 1160, h: 650,
  intro: [
    '整机状态 = `Vmm`（准入开着还是已关闭）× `Guest`（本进程与这台 guest 的关系）× 退出阶段 `Leaving`。',
    '`Stopping` 里没有请求接收端，所以“停止中不再收请求”由类型保证，而不是约定。',
    '`Owned` 内部的执行状态、拓扑与运行权移交分别见另外三张图。',
  ],
  regions: [
    { id: 'SV', x: 20, y: 30, w: 680, h: 500, label: 'Vmm::Serving { admission: Open(server) | Detached, guest }',
      info: { d: '准入开着（或所有客户端已离开）时的全部状态。`Admission::Detached` 只报告一次：有运行权的 guest 继续运行；没有运行权（Absent、Standby）时没人能再推进，于是退出。它取代了现在的 `Starting.detached` 标记。', code: 'rs §5 Vmm / Serving / Admission' } },
    { id: 'SP', x: 720, y: 30, w: 420, h: 500, top: true, label: 'Vmm::Stopping { leaving, exit: ExitFacts }',
      info: { d: '准入已关闭：`Stopping` 没有 server 字段。各阶段只持有自己需要的东西，事实在每个阶段都继续并入 `ExitFacts`。现在的 `teardown()`、`poll_teardown()`、`shutdown_resize()`、`Next::StartTeardown` 四条路径合并到这里。', code: 'rs §5 Stopping / Leaving' } },
  ],
  nodes: {
    AB: { x: 130, y: 130, t: 'Guest::Absent', s: 'MachineSpec', k: 'stable', info: { rows: [
      ['持有', '只有 `MachineSpec`；没有机器，也没有事实来源。'],
      ['离开', 'Start：外壳同步 plan + build，成功后铸造 `RunAuthority(Booted)`。Restore / Receive / Adopt：进入 Importing。'],
      ['现在', '`Controller::NotStarted`'],
    ], code: 'rs §5 Guest::Absent · §7 Next::Start' } },
    OW: { x: 470, y: 130, w: 180, t: 'Guest::Owned', s: '持有运行权 · 内含 Exec', k: 'stable', info: {
      d: '持有运行权的机器。执行状态（Running / Paused / Moving 与导出会话）见「Exec」图，拓扑与在途变更见「拓扑」图。',
      rows: [
        ['字段', '`authority` · `exec: Exec` · `topology` · `changes` · `views` · `facts`'],
        ['事实', '`facts` 挂在整机上，不挂在操作上；现在每个 Busy 变体各存一份 events。'],
        ['现在', '`Controller::{Running, Paused, Busy}`'],
      ], code: 'rs §5 Owned<X = Exec>', go: 'exec' } },
    IM: { x: 130, y: 340, w: 170, t: 'Guest::Importing', s: 'Restore · Receive · Adopt', k: 'busy', info: { rows: [
      ['Restore', '本地快照（现有同进程 `rebuild` 的推广）；成功即得到运行权 `Origin::Restored`。'],
      ['Receive', '迁移目标：先收 Plan + Topology 建 parked 机器，再收内存轮次与最终状态。'],
      ['Adopt', '热升级目标：接管 memfd 与设备后端 fd，按快照重建 VM——KVM fd 不能跨进程使用。'],
      ['失败', '进入 Stopping；清理未证明完成时保留 `PendingCleanup`。'],
    ], code: 'rs §4.2 Import', go: 'authority' } },
    SB: { x: 340, y: 340, t: 'Guest::Standby', s: '有机器 · 无运行权', k: 'noauth', info: {
      d: '机器已就绪（parked），但没有运行权：只能等授予，或被放弃。',
      rows: [
        ['授予', '`AcceptGrant(Grant)`：校验会话与 epoch → `RunAuthority(Granted)` → Owned{Paused}。'],
        ['放弃', '对端失败、编排者放弃或 Detached → 本地 teardown；guest 从未在此运行。'],
      ], code: 'rs §4.2 Standby', go: 'authority' } },
    HD: { x: 560, y: 430, t: 'Guest::Held', s: '运行权扣押 · 保留现场', k: 'term', info: {
      d: '可选的故障策略 `FaultPolicy::Hold`：继续运行会破坏正确性时暂停并保留现场，而不是直接退出（design.new-mem §10.2）。',
      rows: [
        ['运行权', '扣押（`suspended`）：之后只能退出，不能 Resume。'],
        ['允许', '查询；诊断性捕获（仅 `HeldMachine::Paused`）；Shutdown。'],
        ['默认', '策略为 Exit（现状）时不进入此状态，直接 Stopping。'],
      ], code: 'rs §5 Held · §7 FaultPolicy' } },
    SE: { x: 840, y: 200, w: 180, t: 'Leaving::Settling', s: '中止导出 · 等 Moving 落地', k: 'term', info: {
      d: '中止导出会话，等 `Exec::Moving` 落地（有界）。Guest 保持原形，只是不再接受请求。',
      rows: [['之后', '有机器 → TearingDown；无机器 → Done。']], code: 'rs §5 Leaving::Settling' } },
    TD: { x: 840, y: 330, w: 180, t: 'Leaving::TearingDown', s: 'teardown ∥ 在途变更', k: 'term', info: {
      d: 'teardown 与仍在途的作用域变更并行推进：卡住的发布或回收往往要靠 teardown 释放内存才能结算，而它的回复不能丢。',
      rows: [
        ['推广自', '现在的 `shutdown_resize`。'],
        ['失败', 'teardown 到期返回 `PendingCleanup`，保留到 Done；`ExitFacts.cleanup` 记一条。'],
      ], code: 'rs §5 Leaving::TearingDown' } },
    RL: { x: 1045, y: 110, w: 170, t: 'Leaving::Releasing', s: '只做本地释放', k: 'term', info: {
      d: '运行权已交出：停线程、关 fd、解除映射，但不对共享 backing 做破坏性操作（discard、截断、清零）——对端可能正在用同一个 memfd。',
      rows: [
        ['前提', '`&Relinquishment`，只由 `grant` 产生。'],

function initTheme() {
  const root = document.documentElement;
  let saved = null;
  try { saved = localStorage.getItem('vms-theme'); } catch (_) {}
  root.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  $('#theme').addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('vms-theme', root.dataset.theme); } catch (_) {}
  });
}

function init() {
  initTheme();
  $('#tabs').innerHTML = DIAGRAMS.map((d, i) =>
    `<button role="tab" data-id="${d.id}"><span class="n">${i + 1}</span>${esc(d.tab)}</button>`).join('');
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) openDiagram(b.dataset.id); });
  const svg = $('#svg');
  const activate = g => {
    if (!g) return;
    if (g.classList.contains('edge')) showEdge(g.dataset.id); else showNode(g.dataset.id);
  };
  svg.addEventListener('click', e => {
    const g = e.target.closest('.node,.edge,.region.hot');
    if (g) activate(g); else showIntro();
  });
  svg.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(e.target.closest('.node,.edge,.region.hot')); }
  });
  $('#side').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) openDiagram(b.dataset.go); });
  addEventListener('hashchange', () => openDiagram(location.hash.slice(1)));
  openDiagram(location.hash.slice(1));
}

init();
</script>
