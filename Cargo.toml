[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Fuu <g.for.xyz@gmail.com>"]
edition = "2024"

[workspace.dependencies]
api = { path = "crates/api" }
logger = { path = "crates/logger" }
logger-backend = { path = "crates/logger-backend" }
vmm = { path = "crates/vmm" }

anyhow = "1.0.104"
clap = "4.6.7"
displaydoc = "0.2.7"
heck = "0.5.0"
libc = "0.2.189"
log = { version = "0.4.34", features = ["serde", "std"] }
names = { version = "0.14.0", default-features = false }
oneshot = { version = "0.2.1", features = ["std", "async"] }
rustix = { version = "1.1.5", features = [
    "event",
    "fs",
    "process",
    "stdio",
    "thread",
    "time",
] }
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
    "macros",
    "net",
    "rt",
    "signal",
    "sync",
    "time",
] }
toml = "1.1.6"
virtio-queue = "0.18.0"
vm-memory = { version = "0.18.0", features = [
    "backend-atomic",
    "backend-mmap",
] }
vm-superio = "0.8.2"
vmm-sys-util = "0.15.0"

[package]
name = "dragonball-evolved"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
api = { workspace = true, features = ["request"] }
clap = { workspace = true, features = ["env"] }
logger.workspace = true
logger-backend.workspace = true
names.workspace = true
rustix.workspace = true
serde_json.workspace = true
tokio.workspace = true
vmm.workspace = true
vmm-sys-util.workspace = true

[build-dependencies]
anyhow.workspace = true

[profile.release]
strip = "none"
debug = "full"
lto = "fat"
codegen-units = 1
