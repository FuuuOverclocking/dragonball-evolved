[package]
name = "api-macros"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", default-features = false, features = [
    "derive",
    "parsing",
    "printing",
    "proc-macro",
] }

[dev-dependencies]
syn = { version = "2.0.119", default-features = false, features = ["full"] }
